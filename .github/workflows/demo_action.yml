# 1. The name of the workflow as it appears in GitHub's UI
name: My First GitHub Action

# 2. TRIGGER: Run this every time someone pushes code to the main branch
on:
    push:
        branches: [main]

# 3. WHAT TO DO
jobs:
    say-hello:
        # Spin up a clean Ubuntu Linux virtual machine
        runs-on: ubuntu-latest

        # The list of commands to run sequentially
        steps:
            - name: Print a greeting in the cloud log
              run: echo "Hello! GitHub Actions is working on my dbt project!"
